name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identity-service, student-service, enrollment-service, billing-service]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # CI-only placeholder — NOT the real shared secret from backend/*/.env.
      SECRET_KEY: ci-only-secret-key-not-for-production
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/${{ matrix.service }}/requirements.txt

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r backend/${{ matrix.service }}/requirements.txt

      - name: Django system check
        working-directory: backend/${{ matrix.service }}
        run: python manage.py check

      - name: Django deploy-readiness check
        # DEBUG/ALLOWED_HOSTS/SECURE_* are all env-driven now (previously
        # hardcoded True/["*"] with no way to turn them off — see README).
        # The job's default env above intentionally leaves them unset, so
        # the "Django system check" step above runs the way a normal
        # deployment or local run would. This step separately proves the
        # settings module CAN pass Django's --deploy checklist when a real
        # deployment's env vars are supplied — it doesn't affect the tests
        # below, which keep running under the job's normal env.
        working-directory: backend/${{ matrix.service }}
        run: python manage.py check --deploy
        env:
          ALLOWED_HOSTS: example.com
          SECURE_SSL_REDIRECT: "1"
          SESSION_COOKIE_SECURE: "1"
          CSRF_COOKIE_SECURE: "1"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "1"
          SECURE_HSTS_PRELOAD: "1"

      - name: Run tests
        working-directory: backend/${{ matrix.service }}
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/admin-portal/package-lock.json

      - run: npm ci

      - name: Dependency vulnerability scan
        # Now a hard gate. This was report-only while the 16 pre-existing
        # findings stood (axios and react-router-dom in runtime code, the rest
        # transitive build/test-only); those are cleared, so the tree is at
        # zero and the only way back above this line is a new dependency or a
        # newly-published advisory — both of which are worth stopping for.
        #
        # If a fresh advisory lands against something with no fix available
        # yet, prefer a narrow `--exclude` over restoring continue-on-error:
        # one documented exception beats silently ignoring every finding.
        run: npm audit --audit-level=high

      - run: npm run lint
      - run: npm run test

      - name: Production build
        # vite.config.js aborts a production build when these are unset, so a
        # bundle can never silently ship pointing at localhost (it did exactly
        # that, in 16 places, before the guard existed). CI therefore has to
        # supply them -- which also makes this step prove the production path
        # works rather than only the dev one. The values are placeholders; only
        # their presence is being checked here.
        env:
          VITE_IDENTITY_API_URL: https://ci.example.invalid/api/auth
          VITE_STUDENT_API_URL: https://ci.example.invalid/students/api
          VITE_BILLING_API_URL: https://ci.example.invalid/billing/api
          VITE_ENROLLMENT_API_URL: https://ci.example.invalid/enrollment/api
        run: npm run build

      - name: Assert no localhost in the bundle
        # The guard above only proves the vars were set. This proves they were
        # actually used -- a build that baked in localhost fails here.
        run: |
          if grep -rq "localhost:80" dist/assets/; then
            echo "::error::Production bundle contains localhost URLs"
            grep -ro "localhost:80[0-9][0-9]" dist/assets/ | sort -u
            exit 1
          fi
          echo "OK: no localhost URLs in dist/"

  backend-image:
    # The Railway deployment builds backend/Dockerfile (deploy/railway/). Nothing
    # else exercises it, so a broken image would only surface as a failed
    # deploy. This builds each service and starts it the way Railway does --
    # gunicorn on $PORT behind a proxy, production settings -- then requires
    # Railway's own health check request to answer exactly 200 (a 301 from the
    # HTTPS redirect would fail every real deploy).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identity, student, billing, enrollment]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f backend/Dockerfile --build-arg SLIS_SERVICE=${{ matrix.service }} -t slis-${{ matrix.service }} .

      - name: Start like Railway and pass its health check
        run: |
          docker run -d --name app --network host \
            -e PORT=8080 \
            -e SECRET_KEY=ci-only-secret-key-not-for-production \
            -e DB_NAME=postgres -e DB_USER=postgres -e DB_PASSWORD=postgres \
            -e DB_HOST=localhost -e DB_PORT=5432 \
            -e DEBUG=0 -e NUM_PROXIES=1 -e SECURE_SSL_REDIRECT=1 \
            -e ALLOWED_HOSTS=healthcheck.railway.app,localhost \
            slis-${{ matrix.service }}
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: healthcheck.railway.app" http://localhost:8080/health/ || true)
            if [ "$code" = "200" ]; then echo "health check: 200"; exit 0; fi
            echo "attempt $i: $code"; sleep 2
          done
          docker logs app
          exit 1

  frontend-image:
    # frontend/admin-portal/Dockerfile: Vite build + Caddy, as deployed on
    # Railway. Checks the image serves the app on a client-side route, which
    # is what breaks when the SPA fallback is wrong.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -f frontend/admin-portal/Dockerfile \
            --build-arg VITE_IDENTITY_API_URL=https://ci.example.invalid/api/auth \
            --build-arg VITE_STUDENT_API_URL=https://ci.example.invalid/students/api \
            --build-arg VITE_BILLING_API_URL=https://ci.example.invalid/billing/api \
            --build-arg VITE_ENROLLMENT_API_URL=https://ci.example.invalid/enrollment/api \
            -t slis-frontend .

      - name: Serve a client-side route
        run: |
          docker run -d --name web -p 8080:8080 -e PORT=8080 slis-frontend
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/requirements | grep -q '<div id="root">'; then
              echo "SPA fallback: ok"; exit 0
            fi
            sleep 1
          done
          docker logs web
          exit 1
